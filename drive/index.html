<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protected Access</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8f9fa;
    }
    .login-card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #dadce0;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .icon-box {
      width: 60px;
      height: 60px;
      background: #e8f0fe;
      color: #1a73e8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin: 0 auto 20px auto;
    }
    h2 {
      margin: 0 0 10px 0;
      color: #202124;
      font-size: 22px;
    }
    p {
      margin: 0 0 25px 0;
      color: #5f6368;
      font-size: 14px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus {
      border-color: #1a73e8;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1557b0;
    }
    .error-message {
      color: #d93025;
      font-size: 13px;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="icon-box">
      <i class="fa-solid fa-lock"></i>
    </div>
    <h2>Protected Access</h2>
    <p>Please enter the password to access the drive explorer.</p>
    
    <form onsubmit="verifyPassword(event)">
      <div class="input-group">
        <input type="password" id="passwordInput" placeholder="Enter Password" required autocomplete="off">
      </div>
      <button type="submit">Unlock</button>
    </form>

    <div class="error-message" id="errorMessage">
      Incorrect password. Please try again.
    </div>
  </div>

  <script>
    // Configuration
    const CP = "Toufik";
    const TARGET_URL = "https://script.google.com/macros/s/AKfycbwrFNLt7ExZbLtaYODrcQi46tmgjuq5-T1M3hGm161dxJ5voGb9ZdlswF1zzjkU0vS4aw/exec";     // Set your Google Apps Script Web App URL here

    function verifyPassword(event) {
      event.preventDefault();
      const userPassword = document.getElementById('passwordInput').value;
      const errorDiv = document.getElementById('errorMessage');

      if (userPassword === CP) {
        errorDiv.style.display = 'none';
        window.location.href = TARGET_URL;
      } else {
        errorDiv.style.display = 'block';
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
      }
    }
  </script>

</body>
</html>
